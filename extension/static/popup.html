<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>가림</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --t: #121521; --m: #6b7285; --b: #e3e6ec; --a: #5a3ff5; --s: #f4f5f8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #15171f; --t: #eceef4; --m: #9097a8; --b: #2a2e3b; --a: #8e7bff; --s: #1b1e27; } }
      body { margin: 0; width: 300px; background: var(--bg); color: var(--t); font: 13.5px/1.5 -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--b); }
      header img { width: 28px; height: 28px; }
      header b { font-size: 16px; }
      header span { display: block; color: var(--m); font-size: 11.5px; }
      section { padding: 6px 16px; }
      label.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--b); cursor: pointer; }
      label.row small { display: block; color: var(--m); font-size: 11.5px; }
      input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--a); }
      select { font: inherit; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--b); background: var(--s); color: var(--t); }
      .stat { margin: 10px 16px; padding: 10px 12px; background: var(--s); border-radius: 10px; color: var(--m); font-size: 12.5px; }
      .stat b { color: var(--t); }
      footer { display: flex; gap: 8px; padding: 8px 16px 16px; }
      button { flex: 1; font: inherit; font-weight: 650; padding: 8px; border-radius: 9px; border: 1px solid var(--b); background: var(--bg); color: var(--t); cursor: pointer; }
      button.primary { background: var(--a); border-color: var(--a); color: #fff; }
      .tab { margin: 10px 16px 0; padding: 9px 12px; border-radius: 10px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
      .tab.ok { background: color-mix(in srgb, #16a34a 12%, var(--bg)); color: #15803d; }
      .tab.warn { background: color-mix(in srgb, #f59e0b 16%, var(--bg)); color: #b45309; }
      .tab.off { background: var(--s); color: var(--m); }
      .tab button { flex: none; padding: 4px 10px; font-size: 12px; }
      @media (prefers-color-scheme: dark) { .tab.ok { color: #4ade80; } .tab.warn { color: #fbbf24; } }
      .hidden { display: none; }
      .feedback { padding: 0 16px 12px; font-size: 11.5px; color: var(--m); text-align: center; }
      .feedback a { color: var(--m); }
      .feedback a:hover { color: var(--a); }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" alt="" />
      <div><b>가림</b><span>붙여넣는 순간 개인정보 자동 가림</span></div>
    </header>
    <div class="tab hidden" id="tab"><span id="tabText"></span><button id="reload" class="primary hidden">새로고침</button></div>
    <section>
      <label class="row"><span>자동 가림 사용<small>AI 사이트 입력창에 붙여넣을 때</small></span><input type="checkbox" id="enabled" /></label>
      <label class="row"><span>가리는 방식</span>
        <select id="mode"><option value="token">자리표시자 [이름_1]</option><option value="fake">가짜 값 (김가온)</option></select>
      </label>
      <label class="row"><span>AI 안내문 붙이기<small>대화의 첫 붙여넣기에 한 번</small></span><input type="checkbox" id="notice" /></label>
      <label class="row"><span>답변에 원래 값 표시<small>이 화면에서만 바뀌어 보여요</small></span><input type="checkbox" id="reveal" /></label>
    </section>
    <div class="stat" id="stat">불러오는 중…</div>
    <footer>
      <button id="clear">복원 키 지우기</button>
      <button id="open" class="primary">웹앱 열기</button>
    </footer>
    <p class="feedback">건의·오류 제보 <a href="mailto:cgr456@naver.com?subject=%5B%EA%B0%80%EB%A6%BC%5D%20%EA%B1%B4%EC%9D%98%C2%B7%EC%98%A4%EB%A5%98%20%EC%A0%9C%EB%B3%B4" target="_blank">cgr456@naver.com</a></p>
    <script src="popup.js"></script>
  </body>
</html>
